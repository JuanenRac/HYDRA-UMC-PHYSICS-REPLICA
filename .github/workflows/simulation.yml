#
# The dynamics against what physics requires, within stated tolerances, over scenarios drawn from a fixed seed: a pendulum let go from many states keeps its energy and loses more of it the coarser the step, and balls dropped and thrown with many restitutions and frictions never go below the ground, never gain energy, bounce back the fraction the restitution says and come to rest.
# It runs on every push and pull request, by hand, and once a week. Nothing here touches hardware.
# =============================================================================
name: Simulation bench

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "41 5 * * 2"

permissions:
  contents: read

jobs:
  simulation:
    name: Run the simulation bench
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@ccc8c1f930153b792217f06c65a38f23a882993a # 1.85.1
        with:
          toolchain: 1.85.1
      - name: Cache the Cargo registry and the build directory
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Run the simulation bench
        run: cargo test --locked --bin hydra-umc-physics-replica simulation_bench -- --nocapture
